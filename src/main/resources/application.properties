spring.application.name=serviceplatform

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/switch_platform
spring.datasource.username=root
spring.datasource.password=root

# Database Driver and Hibernate Options
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.root=INFO
logging.level.com.switchproject.serviceplatform=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.com.switchproject.serviceplatform.service.ServiceRequestService=DEBUG

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,metrics